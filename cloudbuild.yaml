# ---------------------------------------------------------------------------
# Cloud Build: build the API image, push it, AND deploy to Cloud Run.
#
# This replaces the "Dockerfile"-type trigger (which only built + pushed, never
# deployed). Point the trigger at this file:
#   Trigger → Configuration → Type: "Cloud Build configuration file"
#   Location: /cloudbuild.yaml
#
# The deploy step updates only the image, so existing Cloud Run settings
# (env vars, CORS_ORIGINS, memory, etc.) are preserved.
#
# Do not put $PROJECT_ID inside a custom substitutions: value — Cloud Build
# leaves it as the literal string and the image name fails to parse.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: europe-west1
  _SERVICE: cro-audit-api
  _REPO: cro-audit
  _IMAGE_NAME: cro-audit-api

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${BUILD_ID}
      - -t
      - europe-west1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - europe-west1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=europe-west1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed

images:
  - europe-west1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
  - europe-west1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

# ---------------------------------------------------------------------------
# Cloud Build: build the API image, push it, AND deploy to Cloud Run.
#
# This replaces the "Dockerfile"-type trigger (which only built + pushed, never
# deployed). Point the trigger at this file:
#   Trigger → Configuration → Type: "Cloud Build configuration file"
#   Location: /cloudbuild.yaml
#
# The deploy step updates only the image, so existing Cloud Run settings
# (env vars, CORS_ORIGINS, memory, etc.) are preserved.
# ---------------------------------------------------------------------------

substitutions:
  _REGION: europe-west1
  _SERVICE: cro-audit-api
  _IMAGE: europe-west1-docker.pkg.dev/${PROJECT_ID}/cro-audit/cro-audit-api

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${BUILD_ID}
      - -t
      - ${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed

images:
  - ${_IMAGE}:latest
  - ${_IMAGE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
